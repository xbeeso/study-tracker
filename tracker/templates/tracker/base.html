<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page fit phone screens correctly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Study Tracker{% endblock %}</title>
    <!-- Bootstrap: ready-made styles, loaded from the internet (CDN). -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar: appears on EVERY page that extends this file. -->
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Study Tracker</a>
            <div class="navbar-nav">
                {# 'home' and 'about' are the name= values from urls.py. #}
                <a class="nav-link" href="{% url 'home' %}">Home</a>
                <a class="nav-link" href="{% url 'about' %}">About</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {# Each page fills this block with its own content. #}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
